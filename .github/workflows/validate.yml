name: Validate plugin index

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify index.json
        run: |
          node scripts/build-index.mjs
          git diff --exit-code index.json
